name: Component Release Support

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Hotfix version to release (e.g. 3.17.0.5)'
        required: true
        type: string
      jira_ticket:
        description: 'Jira ticket for the changelog commit'
        required: true
        type: string
      support_branch:
        description: 'Existing support branch (e.g. support/2.16.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Hotfix version to release (e.g. 3.17.0.5)'
        required: true
        type: string
      jira_ticket:
        description: 'Jira ticket for the changelog commit'
        required: true
        type: string
      support_branch:
        description: 'Existing support branch (e.g. support/2.16.0)'
        required: true
        type: string
    secrets:
      RDKCM_DEPLOY_KEY:
        description: 'SSH deploy key for git operations'
        required: true

concurrency:
  group: support-release-${{ github.repository }}-${{ inputs.support_branch }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.tag }}
      JIRA_TICKET: ${{ inputs.jira_ticket }}
      SUPPORT_BRANCH: ${{ inputs.support_branch }}
      GIT_MERGE_AUTOEDIT: 'no'
      GIT_EDITOR: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ inputs.support_branch }}
          ssh-key: ${{ secrets.RDKCM_DEPLOY_KEY }}

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "187267378+rdkcm-rdke@users.noreply.github.com"

      - name: Install git-flow and auto-changelog
        run: |
          sudo apt-get update
          sudo apt-get install -y git-flow
          npm install -g auto-changelog@2.5.0

      - name: Release support hotfix
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo 'Version must contain numeric components separated by dots.' >&2; exit 1; }
          [[ "$SUPPORT_BRANCH" == support/* ]] && git check-ref-format "refs/heads/$SUPPORT_BRANCH" || { echo 'A valid support/* branch is required.' >&2; exit 1; }
          [[ "$JIRA_TICKET" =~ ^[A-Z][A-Z0-9_]*-[0-9]+$ ]] || { echo 'A Jira ticket (e.g. RDKEMW-10110) is required.' >&2; exit 1; }

          git fetch origin
          git checkout "$SUPPORT_BRANCH"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/hotfix/$RELEASE_VERSION"; then
            echo "Hotfix branch hotfix/$RELEASE_VERSION already exists." >&2
            exit 1
          fi

          git config gitflow.branch.master "$SUPPORT_BRANCH"
          git config gitflow.branch.develop "$SUPPORT_BRANCH"
          git flow init -f -d
          git config gitflow.prefix.versiontag ''

          git flow hotfix start "$RELEASE_VERSION"
          auto-changelog -v "$RELEASE_VERSION"
          git add CHANGELOG.md
          git commit -s -m "$JIRA_TICKET - Changelog updates for $RELEASE_VERSION"
          git flow hotfix publish "$RELEASE_VERSION"

          if ! git flow hotfix finish -m "$RELEASE_VERSION hotfix" "$RELEASE_VERSION"; then
            git status --short
            git merge --continue
            git flow hotfix finish -m "$RELEASE_VERSION hotfix" "$RELEASE_VERSION"
          fi
          git push --atomic origin "refs/heads/$SUPPORT_BRANCH:refs/heads/$SUPPORT_BRANCH" "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          printf 'Released `%s` on `%s`.\n' "$RELEASE_VERSION" "$SUPPORT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
