name: Shared Cherry-Pick Engine

on:
  workflow_call:
    inputs:
      raw_labels:
        description: 'JSON array of labels from the triggering PR event'
        required: true
        type: string
    secrets:
      CROSS_REPO_TOKEN:
        description: 'PAT with org-wide repo write access for cross-repo label propagation'
        required: false

jobs:
  backport:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Metadata & Propagate to Sister PRs
        id: parse_meta
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          CURRENT_PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # 1. Parse the target destination branch and custom topic label
          TARGET_LABEL=$(echo '${{ inputs.raw_labels }}' | jq -r '.[] | .name' | grep "cherry-pick to " | head -n 1)
          TARGET_BRANCH=${TARGET_LABEL#"cherry-pick to "}
          CUSTOM_TOPIC=$(echo '${{ inputs.raw_labels }}' | jq -r '.[] | .name' | grep "^topic:" | head -n 1)

          if [ -z "$TARGET_BRANCH" ]; then
            echo "No valid cherry-pick destination branch found. Exiting."
            exit 0
          fi

          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT
          echo "custom_topic=$CUSTOM_TOPIC" >> $GITHUB_OUTPUT

          # 3. Build branch-suffixed topic label for the cherry-picked PR
          #    e.g. topic:billing-v2 → topic:billing-v2_stable2 (for support/stable2)
          #    e.g. topic:billing-v2 → topic:billing-v2_8.6_p1b (for release/8.6_p1b)
          BACKPORT_LABEL=""
          if [ -n "$CUSTOM_TOPIC" ]; then
            BRANCH_SUFFIX=$(echo "$TARGET_BRANCH" | sed 's|^support/||; s|^release/||; s|^feature/||')
            BACKPORT_LABEL="${CUSTOM_TOPIC}_${BRANCH_SUFFIX}"
            echo "Backport label for cherry-picked PR: $BACKPORT_LABEL"
          fi
          echo "backport_label=$BACKPORT_LABEL" >> $GITHUB_OUTPUT

          # 2. THE CHAIN REACTION: If a topic label exists, find and tag sister PRs
          if [ -n "$CUSTOM_TOPIC" ]; then
            echo "Found topic label '$CUSTOM_TOPIC'. Searching for sister PRs to auto-trigger..."
            ORG_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f1)

            # Find all merged PRs across the org sharing this exact topic label
            SISTER_PRS=$(gh search prs --label "$CUSTOM_TOPIC" --owner "$ORG_NAME" --state closed --merged --json url,labels 2>/dev/null || echo "[]")

            for row in $(echo "$SISTER_PRS" | jq -r '.[] | @base64'); do
              _jq() { echo ${row} | base64 --decode | jq -r ${1}; }
              SISTER_URL=$(_jq '.url')

              # Skip the current PR (already running)
              if [ "$SISTER_URL" == "$CURRENT_PR_URL" ]; then
                echo "⏭️ Skipping self: $SISTER_URL"
                continue
              fi

              # Guard: skip if sister PR already has the cherry-pick label (prevents infinite loop)
              EXISTING_LABELS=$(echo ${row} | base64 --decode | jq -r '.labels[].name' 2>/dev/null)
              if echo "$EXISTING_LABELS" | grep -qF "$TARGET_LABEL"; then
                echo "⏭️ Already labeled: $SISTER_URL"
                continue
              fi

              echo "🔗 Propagating '$TARGET_LABEL' to sister PR: $SISTER_URL"
              # Ensure the cherry-pick label exists in the sister repo before adding
              SISTER_REPO=$(echo "$SISTER_URL" | sed -E 's|https://github.com/([^/]+/[^/]+)/pull/.*|\1|')
              gh label create "$TARGET_LABEL" --repo "$SISTER_REPO" --color "d93f0b" --force >/dev/null 2>&1 || true
              gh pr edit "$SISTER_URL" --add-label "$TARGET_LABEL" 2>/dev/null || echo "⚠️ Could not label $SISTER_URL (check token permissions)"
            done
          fi

      - name: Checkout Code
        if: steps.parse_meta.outputs.target_branch != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Execute Cherry-Pick
        if: steps.parse_meta.outputs.target_branch != ''
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.parse_meta.outputs.target_branch }}
          BACKPORT_LABEL: ${{ steps.parse_meta.outputs.backport_label }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get the merge commit and find the original commits
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          COMMITS=$(git log --pretty=format:"%H" ${MERGE_SHA}^1..${MERGE_SHA}^2 2>/dev/null || echo "$MERGE_SHA")
          # For squash merges, use the merge commit itself
          if [ -z "$COMMITS" ]; then
            COMMITS="$MERGE_SHA"
          fi

          CHERRY_PICK_BRANCH="cherry-pick-${PR_NUMBER}-to-$(echo $TARGET_BRANCH | sed 's|/|-|g')"

          # Create branch from target
          git fetch origin "$TARGET_BRANCH"
          git checkout -b "$CHERRY_PICK_BRANCH" "origin/$TARGET_BRANCH"

          # Attempt cherry-pick
          CONFLICT=false
          for COMMIT in $COMMITS; do
            if ! git cherry-pick -x "$COMMIT" 2>/dev/null; then
              CONFLICT=true
              git cherry-pick --abort 2>/dev/null || true
              break
            fi
          done

          if [ "$CONFLICT" = "true" ]; then
            # Post failure comment
            gh pr comment "$PR_URL" --body "$(printf '⚠️ **Cherry-pick to \x60%s\x60 failed due to merge conflicts.**\n\nPlease resolve the conflicts manually, create a PR targeting \x60%s\x60, and ensure the changes are applied correctly.' "$TARGET_BRANCH" "$TARGET_BRANCH")"
            echo "Cherry-pick failed due to conflicts."
            exit 0
          fi

          # Push the branch
          git push origin "$CHERRY_PICK_BRANCH"

          # Build label args
          LABEL_ARGS=""
          if [ -n "$BACKPORT_LABEL" ]; then
            # Ensure the branch-suffixed topic label exists before using it
            gh label create "$BACKPORT_LABEL" --repo "$REPO" --color "0e8a16" --force >/dev/null 2>&1 || true
            LABEL_ARGS="--label $BACKPORT_LABEL"
          fi

          # Create the PR
          gh pr create \
            --repo "$REPO" \
            --head "$CHERRY_PICK_BRANCH" \
            --base "$TARGET_BRANCH" \
            --title "$PR_TITLE" \
            --body "Cherry-pick of #${PR_NUMBER} to \`$TARGET_BRANCH\`." \
            $LABEL_ARGS

          echo "✅ Cherry-pick PR created successfully."
