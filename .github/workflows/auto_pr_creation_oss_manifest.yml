name: OSS Manifest Auto PR Creation

on:
  workflow_call:
    secrets:
      RDKCM_RDKE:
        required: true

jobs:
  auto_pr_creation_oss_manifest:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rdkcentral' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout build_tools_workflows code
        uses: actions/checkout@v5
        with:
          repository: rdkcentral/build_tools_workflows
          path: 'tools'
          ref: develop
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Checkout OSS manifest repository
        uses: actions/checkout@v5
        with:
          repository: rdkcentral/rdke-oss-manifest
          path: rdke-oss-manifest
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Configure Git for OSS manifest
        working-directory: rdke-oss-manifest
        env:
          BOT_EMAIL: ${{ vars.RDKM_BOT_EMAIL }}
        run: |
          git config user.name "bot"
          git config user.email "$BOT_EMAIL"

      - name: Checkout common OSS manifest repository
        uses: actions/checkout@v5
        with:
          repository: rdkcentral/rdk-oss-common-manifest
          path: rdk-oss-common-manifest
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Configure Git for common OSS manifest
        working-directory: rdk-oss-common-manifest
        env:
          BOT_EMAIL: ${{ vars.RDKM_BOT_EMAIL }}
        run: |
          git config user.name "bot"
          git config user.email "$BOT_EMAIL"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests PyGithub GitPython

      - name: Run the update script for OSS manifest
        working-directory: rdke-oss-manifest
        env:
          GITHUB_TOKEN: ${{ secrets.RDKCM_RDKE }}
          GITHUB_ORG: rdkcentral
          MANIFEST_REPO_PATH: ${{ github.workspace }}/rdke-oss-manifest
          MANIFEST_REPO_NAME: rdkcentral/rdke-oss-manifest
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          AUTO_MERGE_LABEL: oss-auto-merge
        run: python3 ../tools/build_health_check_workflow_scripts/auto_pr_generation_manifest.py

      - name: Run the update script for common OSS manifest
        working-directory: rdk-oss-common-manifest
        env:
          GITHUB_TOKEN: ${{ secrets.RDKCM_RDKE }}
          GITHUB_ORG: rdkcentral
          MANIFEST_REPO_PATH: ${{ github.workspace }}/rdk-oss-common-manifest
          MANIFEST_REPO_NAME: rdkcentral/rdk-oss-common-manifest
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          AUTO_MERGE_LABEL: oss-auto-merge
        run: python3 ../tools/build_health_check_workflow_scripts/auto_pr_generation_manifest.py
