name: Update Manifests on Meta Repo Merge

on:
  workflow_call:
    secrets:
      RDKCM_RDKE:
        required: true

jobs:
  auto_pr_creation_manifest:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout build_tools_workflows code
        uses: actions/checkout@v5
        with:
          repository: rdkcentral/build_tools_workflows
          path: 'tools'
          # Temporary checkout; revert to develop after merge.
          ref: feature/oss-auto-merge
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Checkout RDKE OSS Manifest Repository
        uses: actions/checkout@v5
        with:
          repository: 'rdkcentral/rdke-oss-manifest'
          path: 'rdke_oss_manifest_repo'
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Update Git Config
        env:
          BOT_EMAIL: ${{ vars.RDKM_BOT_EMAIL }}
        run: |
            cd rdke_oss_manifest_repo
            git config user.name "bot"
            git config user.email "$BOT_EMAIL"
            cd ..

      - name: Checkout Common OSS Manifest Repository
        uses: actions/checkout@v5
        with:
          repository: 'rdkcentral/rdk-oss-common-manifest'
          path: 'common_oss_manifest_repo'
          token: ${{ secrets.RDKCM_RDKE }}

      - name: Update Git Config
        env:
          BOT_EMAIL: ${{ vars.RDKM_BOT_EMAIL }}
        run: |
            cd common_oss_manifest_repo
            git config user.name "bot"
            git config user.email "$BOT_EMAIL"
            cd ..

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests PyGithub GitPython

      - name: Run the update script for rdke_oss_manifest
        env:
          GITHUB_TOKEN: ${{ secrets.RDKCM_RDKE }}
          GITHUB_ORG: 'rdkcentral'
          MANIFEST_REPO_PATH: ${{ github.workspace }}/rdke_oss_manifest_repo
          MANIFEST_REPO_NAME: 'rdkcentral/rdke-oss-manifest'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
            cd rdke_oss_manifest_repo
            python3 ../tools/build_health_check_workflow_scripts/auto_pr_generation_manifest.py
            cd ..

      - name: Run the update script for rdk-oss-common
        env:
          GITHUB_TOKEN: ${{ secrets.RDKCM_RDKE }}
          GITHUB_ORG: 'rdkcentral'
          MANIFEST_REPO_PATH: ${{ github.workspace }}/common_oss_manifest_repo
          MANIFEST_REPO_NAME: 'rdkcentral/rdk-oss-common-manifest'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
            cd common_oss_manifest_repo
            python3 ../tools/build_health_check_workflow_scripts/auto_pr_generation_manifest.py
            cd ..
