name: Fossid Pre-merge Stateless Diff Scan

on:
  workflow_call:
    secrets:
      FOSSID_CONTAINER_USERNAME:
        required: true
      FOSSID_CONTAINER_PASSWORD:
        required: true
      FOSSID_HOST_USERNAME:
        required: true
      FOSSID_HOST_TOKEN:
        required: true

concurrency:
  group: fossid-diffscan-${{ github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-diffscan:
    name: Fossid Annotate PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.FOSSID_CONTAINER_USERNAME }}
          password: ${{ secrets.FOSSID_CONTAINER_PASSWORD }}

      - name: Fetch Ignore List and Formatter Script
        run: |
          mkdir -p /tmp/fossid
          curl -fsSL https://raw.githubusercontent.com/rdkcentral/build_tools_workflows/feature/fossid-sarif/ignore_projects_fossid -o /tmp/fossid/ignore_projects_fossid
          curl -fsSL https://raw.githubusercontent.com/rdkcentral/build_tools_workflows/feature/fossid-sarif/build_health_check_workflow_scripts/format_fossid.py -o /tmp/fossid/format_fossid.py

      - name: Run FossID Toolbox Diffscan (Docker)
        env:
          FOSSID_HOST_USERNAME: ${{ secrets.FOSSID_HOST_USERNAME }}
          FOSSID_HOST_TOKEN: ${{ secrets.FOSSID_HOST_TOKEN }}
          BASE_REF_NAME: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF_NAME:refs/remotes/origin/$BASE_REF_NAME" || git fetch origin "$BASE_REF_NAME"
          BASE_REF="origin/$BASE_REF_NAME"
          COMPARE_REF="HEAD"

          echo "Running diffscan with base-ref: $BASE_REF and compare-ref: $COMPARE_REF"

          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "/tmp/fossid:/fossid_config" \
            -w /repo \
            -e FOSSID_HOST_USERNAME \
            -e FOSSID_HOST_TOKEN \
            -e BASE_REF="$BASE_REF" \
            -e COMPARE_REF="$COMPARE_REF" \
            --entrypoint /bin/sh \
            quay.io/fossid/fossid-toolbox:1.5.29 \
            -c 'git config --global --add safe.directory /repo && \
                fossid diffscan \
                  --fossid-host "$FOSSID_HOST_USERNAME" \
                  --fossid-token "$FOSSID_HOST_TOKEN" \
                  --base-ref "$BASE_REF" \
                  --compare-ref "$COMPARE_REF" \
                  --format json \
                  --ignore-projects /fossid_config/ignore_projects_fossid' > /tmp/fossid/fossid_raw.json
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "::error::FossID diffscan failed (exit code $rc)"
            cat /tmp/fossid/fossid_raw.json || true
            exit "$rc"
          fi

          if [ ! -s /tmp/fossid/fossid_raw.json ]; then
            echo "::error::FossID diffscan produced no output"
            exit 1
          fi

      - name: Evaluate FossID Matches
        id: evaluate-fossid
        run: |
          python3 /tmp/fossid/format_fossid.py /tmp/fossid/fossid_raw.json --sarif fossid.sarif

      - name: Upload FossID SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('fossid.sarif') != ''
        with:
          sarif_file: fossid.sarif
          category: fossid-license-compliance